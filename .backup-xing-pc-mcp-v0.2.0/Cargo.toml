[package]
name = "xing-pc-mcp"
version = "0.2.0"
edition = "2021"
description = "Read-only remote MCP server for xing-pc (Streamable HTTP, allowlisted roots and command presets), hardened with QFLTL"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
getrandom = "0.2"
blake3 = "1"
# QFLTL: DPAPI keystore for the token at rest (qfltl_crypto::keystore).
qfltl-crypto = { path = "../../QFLTL/crates/core/qfltl-crypto" }

[profile.release]
opt-level = 3
lto = "thin"
